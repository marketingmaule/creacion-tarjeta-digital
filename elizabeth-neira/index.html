<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Neira Garrido - Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --heading: #0f172a;
            --muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); padding: 30px 20px; text-align: center; border: 1px solid #e2e8f0; }
        .avatar { width: 90px; height: 90px; background: #e2e8f0; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary); font-weight: 700; }
        h1 { font-size: 1.4rem; color: var(--heading); margin-bottom: 4px; }
        h2 { font-size: 0.95rem; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
        .company { font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
        
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }
        .btn-secondary { background: #f1f5f9; color: var(--primary); border: 1px solid #cbd5e1; }
        .btn:hover { opacity: 0.9; }
        .info-list { text-align: left; margin: 20px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; padding: 15px 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .info-item { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">E</div>
        <h1>Elizabeth Neira Garrido</h1>
        <h2>Productora artesanal</h2>
        <div class="company">Fundas y Cojines</div>
        
        
        <div class="info-list">
            <a href="tel:+56953952479" class="info-item">📞 +56 953952479</a>
            <a href="mailto:elyneiragarrido@gmail.com" class="info-item">✉️ elyneiragarrido@gmail.com</a>
            <div class="info-item">📍 Chillán, Chile</div>
            
            <a href="https://www.facebook.com/ely.neira.315/" target="_blank" class="info-item">🔗 Red Social Principal</a>
        </div>

        <div class="actions">
            <a href="contacto.vcf" class="btn btn-primary" download>💾 Guardar Contacto</a>
            <a href="tel:+56953952479" class="btn btn-secondary">📞 Llamar Ahora</a>
        </div>
    </div>
</body>
</html>
